        area: Robotics
        studyType: B.S.
        start_date: 2020-03
        end_date: 2024-02
        highlights:
          - Undergraduate studies in robotics with projects in navigation, localization, and multi-robot systems.

    Experience:
      - company: CILAB, Yonsei University
        position: Ph.D. Student
        location: Seoul, Republic of Korea
        start_date: 2024-03
        summary: Researcher working on robot localization, SLAM, and geometry-aware 3D scene representation.
        highlights:
          - Develops localization and mapping methods based on Gaussian splatting and neural radiance fields.
          - Studies robust pose refinement and geometric uncertainty for real-world robotics applications.

    Awards:
      - title: ICROS 2023 Paper Award
        authors:
          - Institute of Control, Robotics and Systems
        date: 2023
        awarder: ICROS 2023
        url: http://2023.icros.org/?page_id=61
